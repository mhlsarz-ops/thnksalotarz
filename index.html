<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About You - The 1975</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
</head>
<body>

    <div class="film-container">
        <div id="film-bg"></div>
    </div>

    <div class="overlay-dark"></div>

    <div id="chat-container"></div>

    <div id="player-card" class="player-card">
        <div class="cover-wrapper">
            <img src="album.jpg" alt="Album Cover" class="player-cover">
            <div class="shimmer"></div>
        </div>
        
        <div class="ui-elements">
            <div class="track-info">
                <h2>About You</h2>
                <p>The 1975</p>
            </div>
            <div class="progress-container">
                <span class="time" id="current-time">0:00</span>
                <div class="progress-bar"><div class="progress" id="progress-bar-fill"></div></div>
                <span class="time" id="duration-time">-1:00</span>
            </div>
            <div class="controls">
                <span class="material-symbols-outlined icon-btn icon-small">volume_up</span>
                <span class="material-symbols-outlined icon-btn icon-mid">skip_previous</span>
                <button id="play-btn" class="play-circle">
                    <span id="play-icon" class="material-symbols-outlined icon-play">play_arrow</span>
                </button>
                <span class="material-symbols-outlined icon-btn icon-mid">skip_next</span>
                <span class="material-symbols-outlined icon-btn icon-small">favorite_border</span>
            </div>
        </div>
    </div>

    <div id="credit-wrapper" class="credit-wrapper">
        <span id="credit-text"></span><span class="cursor">|</span>
    </div>

    <img src="gif1.gif" id="walking-gif" class="walking-gif" alt="Walking Pet">

    <div id="frame-1" class="slideshow-container hidden">
        <div class="landscape-frame">
            <div id="img-1" class="puzzle-wrapper"></div>
            <div class="shimmer-frame"></div> 
        </div>
        <div id="lyric-1" class="lyric"></div>
    </div>

    <div id="frame-2" class="slideshow-container hidden">
        <div class="landscape-frame">
            <div id="img-2" class="puzzle-wrapper"></div>
            <div class="shimmer-frame"></div> 
        </div>
        <div id="lyric-2" class="lyric"></div>
    </div>

    <div id="effects-layer">
        <div class="grain-overlay"></div>
        <div class="light-vignette"></div>
        <div class="particles"></div>
    </div>

    <audio id="audio-player" src="lagu.mp3"></audio>

    <script src="index.js"></script>
</body>
</html>
